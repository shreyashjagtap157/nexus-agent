<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NexusAgent — Provider Vault</title>
<style>
:root{color-scheme:dark;--bg:#050a10;--panel:#0c1521;--line:#20324b;--text:#e9f1fb;--muted:#8da0b8}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 15% 0,#18314c 0,#050a10 50%,#02050a 100%);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#07101bdf;backdrop-filter:blur(10px);z-index:3}
h1{font-size:18px;margin:0}.sub{font-size:11px;color:var(--muted)}a,.btn{color:var(--text)}.btn{border:1px solid var(--line);background:#101b2a;padding:8px 12px;border-radius:8px;cursor:pointer}
main{padding:12px;display:grid;grid-template-columns:1.1fr 1fr;gap:12px}.panel{border:1px solid var(--line);background:rgba(12,21,33,.93);border-radius:12px;overflow:hidden}
.panel h2{margin:0;padding:11px 12px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.body{padding:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #17253a;padding:8px;font-size:12px}th{color:var(--muted);font-size:10px;text-transform:uppercase}.provider{cursor:pointer}.provider:hover{background:#101a2a}
label{display:block;color:var(--muted);font-size:11px;margin:10px 0 4px}input,select{width:100%;padding:9px;background:#08111d;border:1px solid var(--line);border-radius:8px;color:var(--text)}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;gap:8px;margin-top:12px}.primary{flex:1;background:#0b3144;border-color:#2b7194}.notice{margin-top:10px;color:var(--muted);font-size:11px}.key{font-family:ui-monospace,monospace}
@media(max-width:900px){main{grid-template-columns:1fr}}
</style></head>
<body>
<header><div><h1>NexusAgent / Provider Vault</h1><div class="sub">Credentials are separated from model and endpoint configuration.</div></div><div><a class="btn" href="/agents.html">Agents</a> <a class="btn" href="/activity.html">Activity</a> <a class="btn" href="/">Workspace</a></div></header>
<main>
<section class="panel"><h2>Providers</h2><div class="body"><div id="providers">Loading…</div></div></section>
<section class="panel"><h2>Configuration</h2><div class="body">
<div id="selected" class="sub">Select a provider.</div>
<label>Model</label><input id="model" placeholder="provider/model-name">
<div class="row"><div><label>Base URL</label><input id="base" placeholder="https://.../v1"></div><div><label>Chat API URL</label><input id="api" placeholder="https://.../chat/completions"></div></div>
<div class="row"><div><label>Context size</label><input id="context" type="number"></div><div><label>Max output tokens</label><input id="tokens" type="number"></div></div>
<div class="row"><div><label>Reasoning budget</label><input id="reasoning" type="number" min="1"></div><div><label>Top-p</label><input id="top_p" type="number" min="0" max="1" step="0.01"></div></div>
<div class="row"><div><label>Request timeout (s)</label><input id="timeout" type="number" min="1"></div><div><label>Pending poll interval (s)</label><input id="poll" type="number" min="0.1" step="0.1"></div></div>
<div class="row"><div><label>Pending max wait (s)</label><input id="pending_wait" type="number" min="1"></div><div></div></div>
<label>API credential</label><input id="key" type="password" autocomplete="off" placeholder="value is never rendered after storage">
<div class="actions"><button class="btn primary" id="save">Save configuration</button><button class="btn" id="credential">Store credential</button><button class="btn" id="remove">Remove credential</button></div>
<div id="notice" class="notice"></div>
</div></section></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let selected="";
async function load(){
 const [pr,cr,cf]=await Promise.all([fetch("/api/providers"),fetch("/api/auth"),fetch("/api/provider-config")]);
 const providers=(await pr.json()).providers||[], creds=(await cr.json()).credentials||[], cfg=(await cf.json()).providers||{};
 const credMap={};creds.forEach(x=>credMap[x.provider]=x.key);
 $("providers").innerHTML="<table><thead><tr><th>Provider</th><th>Protocol</th><th>Credential</th><th>Endpoint</th></tr></thead><tbody>"+providers.map(p=>"<tr class='provider' data-id='"+esc(p.id)+"'><td>"+esc(p.name)+"<div class='sub'>"+esc(p.id)+"</div></td><td>"+esc(p.protocol)+"</td><td class='key'>"+esc(credMap[p.id]||"not set")+"</td><td>"+esc(cfg[p.id]?.api_url||cfg[p.id]?.base_url||p.base_url||"provider-native")+"</td></tr>").join("")+"</tbody></table>";
 document.querySelectorAll(".provider").forEach(el=>el.onclick=()=>select(el.dataset.id,cfg));
 if(!selected && providers[0])select(providers[0].id,cfg);
}
function select(id,cfg){selected=id;$("selected").textContent="Selected: "+id;const v=cfg[id]||{};$("model").value=v.model||"";$("base").value=v.base_url||"";$("api").value=v.api_url||"";$("context").value=v.context_size||"";$("tokens").value=v.max_tokens||"";$("reasoning").value=v.reasoning_budget||"";$("top_p").value=v.top_p||"";$("timeout").value=v.timeout_seconds||"";$("poll").value=v.pending_poll_seconds||"";$("pending_wait").value=v.pending_max_wait_seconds||"";$("key").value="";}
function notice(t){$("notice").textContent=t}
$("save").onclick=async()=>{if(!selected){notice("Select a provider.");return}const body={model:$("model").value||null,base_url:$("base").value||null,api_url:$("api").value||null,context_size:$("context").value?+$("context").value:null,max_tokens:$("tokens").value?+$("tokens").value:null,reasoning_budget:$("reasoning").value?+$("reasoning").value:null,top_p:$("top_p").value?+$("top_p").value:null,timeout_seconds:$("timeout").value?+$("timeout").value:null,pending_poll_seconds:$("poll").value?+$("poll").value:null,pending_max_wait_seconds:$("pending_wait").value?+$("pending_wait").value:null};const r=await fetch("/api/provider-config/"+encodeURIComponent(selected),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json();notice(r.ok?"Saved configuration for "+selected:String(d.detail||"save failed"));if(r.ok)load()};
$("credential").onclick=async()=>{if(!selected){notice("Select a provider.");return}const key=$("key").value;if(!key){notice("Enter a credential.");return}const r=await fetch("/api/auth/"+encodeURIComponent(selected),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({api_key:key})});const d=await r.json();notice(r.ok?"Credential stored for "+selected:String(d.detail||"credential save failed"));$("key").value="";if(r.ok)load()};
$("remove").onclick=async()=>{if(!selected){notice("Select a provider.");return}const r=await fetch("/api/auth/"+encodeURIComponent(selected),{method:"DELETE"});const d=await r.json();notice(d.removed?"Credential removed.":"No stored credential.");if(r.ok)load()};
load();
</script></body></html>
