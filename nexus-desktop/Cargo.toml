[package]
name = "nexus-desktop"
version = "0.3.0-alpha.3"
edition = "2021"
rust-version = "1.95"
description = "Native desktop control surface for the NexusAgent local multi-agent runtime"
license = "MIT"
repository = "https://github.com/shreyashjagtap157/nexus-agent"

[dependencies]
eframe = "0.36.2"
reqwest = { version = "0.13.5", default-features = true, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
