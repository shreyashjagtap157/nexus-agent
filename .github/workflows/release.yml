name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: nexus-agent-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_version.py --tag "$GITHUB_REF_NAME"

  python-package:
    name: Build Python package
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  native:
    name: Build native client
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: nexus
            path: nexus-rs/target/release/nexus
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: nexus.exe
            path: nexus-rs/target/release/nexus.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: nexus
            path: nexus-rs/target/release/nexus
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --manifest-path nexus-rs/Cargo.toml --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-${{ matrix.target }}
          path: nexus-rs/target/${{ matrix.target }}/release/${{ matrix.binary }}

  desktop:
    name: Build native desktop
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: nexus-desktop
            path: nexus-desktop/target/release/nexus-desktop
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: nexus-desktop.exe
            path: nexus-desktop/target/release/nexus-desktop.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: nexus-desktop
            path: nexus-desktop/target/release/nexus-desktop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --manifest-path nexus-desktop/Cargo.toml --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-desktop-${{ matrix.target }}
          path: nexus-desktop/target/${{ matrix.target }}/release/${{ matrix.binary }}

  publish:
    name: Publish GitHub release
    needs: [python-package, native, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Flatten assets
        run: |
          mkdir -p flattened
          find release-assets -type f -exec cp {} flattened/ \;
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: flattened/*
          generate_release_notes: true
          fail_on_unmatched_files: false
