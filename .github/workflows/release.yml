name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: nexus-agent-release
  cancel-in-progress: false

jobs:
  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Verify tag belongs to main history
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"

      - name: Validate canonical version and tag
        run: python scripts/check_version.py --tag "$GITHUB_REF_NAME"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Compile Python package
        run: python -m compileall -q src

      - name: Run complete Python tests
        run: python -m pytest tests/ -q --tb=short

      - name: Ruff
        run: |
          python -m ruff check src/
          python -m ruff format --check src/

      - name: MyPy
        run: python -m mypy src/nexus_agent/

      - name: Rust formatting
        uses: dtolnay/rust-toolchain@stable

      - run: cargo fmt --manifest-path nexus-rs/Cargo.toml -- --check
      - run: cargo check --manifest-path nexus-rs/Cargo.toml
      - run: cargo fmt --manifest-path nexus-desktop/Cargo.toml -- --check
      - run: cargo check --manifest-path nexus-desktop/Cargo.toml

  python-package:
    name: Build Python package
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Attest Python package
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

  native:
    name: Build native client
    needs: release-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: nexus
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: nexus.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: nexus
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --release --manifest-path nexus-rs/Cargo.toml --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-${{ matrix.target }}
          path: nexus-rs/target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14

      - name: Attest native binary
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: nexus-rs/target/${{ matrix.target }}/release/${{ matrix.binary }}

  desktop:
    name: Build native desktop
    needs: release-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: nexus-desktop
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: nexus-desktop.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: nexus-desktop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --release --manifest-path nexus-desktop/Cargo.toml --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-desktop-${{ matrix.target }}
          path: nexus-desktop/target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14

      - name: Attest desktop binary
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: nexus-desktop/target/${{ matrix.target }}/release/${{ matrix.binary }}

  publish:
    name: Publish release
    needs: [python-package, native, desktop]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nexus-agent/
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-assets

      - name: Flatten release assets
        run: |
          mkdir -p flattened
          find release-assets -type f -exec cp {} flattened/ \;

      - name: Download Python package
        uses: actions/download-artifact@v7
        with:
          name: python-package
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: flattened/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
