name: Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: nexus-agent-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package and audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pip-audit
          python -m pip check

      - name: Audit installed dependencies
        run: python -m pip_audit --local --strict --skip-editable

  dependency-graph:
    name: Dependency graph availability
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.probe.outputs.enabled }}
    steps:
      - name: Check repository dependency graph
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/dependency-graph/sbom")
          case "$status" in
            200)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              echo "Dependency graph is available; dependency review will run."
              ;;
            404)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              echo "::warning::GitHub Dependency Graph is disabled or unavailable for this repository; dependency-review-action will be skipped. Enable the Dependency Graph in repository settings to restore this gate."
              ;;
            *)
              echo "Unable to verify Dependency Graph availability (HTTP $status)." >&2
              exit 1
              ;;
          esac

  dependency-review:
    name: Dependency review
    needs: dependency-graph
    if: github.event_name == 'pull_request' && needs.dependency-graph.result == 'success' && needs.dependency-graph.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@v5


  required:
    name: Required
    if: always()
    needs: [codeql, dependency-audit, dependency-graph, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce security quality gate
        env:
          CODEQL: ${{ needs.codeql.result }}
          DEPENDENCY_AUDIT: ${{ needs.dependency-audit.result }}
          DEPENDENCY_GRAPH: ${{ needs.dependency-graph.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
        shell: bash
        run: |
          set -eu
          for result in "codeql=$CODEQL" "dependency-audit=$DEPENDENCY_AUDIT" "dependency-graph=$DEPENDENCY_GRAPH" "dependency-review=$DEPENDENCY_REVIEW"; do
            case "$result" in
              *success) ;;
              *skipped) ;;
              *) echo "Security gate failed: $result"; exit 1 ;;
            esac
          done
          echo "All required security gates passed."
