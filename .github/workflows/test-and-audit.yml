name: Test & Audit

concurrency:
  group: nexus-agent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-audit:
    name: Audit and evidence report
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Run complete test suite
        run: |
          python -m pytest tests/ -q --tb=short > pytest_output.txt 2>&1

      - name: Generate audit reports
        run: |
          python .githooks/pre-commit --from-file pytest_output.txt --ci

      - name: Upload test and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-audit-evidence
          path: |
            pytest_output.txt
            docs/exhaustive_audit.md
            docs/FRESH_AUDIT.md
