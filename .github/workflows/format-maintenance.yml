name: One-time source formatting

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/format-maintenance.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  format:
    name: Format source and open review PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Format Python source
        run: |
          python -m pip install --upgrade ruff
          python -m ruff format src/
      - name: Format Rust projects
        run: |
          cargo fmt --manifest-path nexus-rs/Cargo.toml
          cargo fmt --manifest-path nexus-desktop/Cargo.toml
      - name: Create formatting-only pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src nexus-rs nexus-desktop; then
            echo "All source files are already formatted."
            exit 0
          fi
          branch="automation/formatting-${GITHUB_SHA:0:12}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src nexus-rs nexus-desktop
          git commit -m "style: format Python and native source"
          git push --set-upstream origin "$branch"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "style: format Python and native source" \
            --body "Automated formatter-only changes from Ruff and stable rustfmt. No intended behavioral changes. CI must qualify this PR before merge."
