name: Native Clients

concurrency:
  group: nexus-agent-native-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-check:
    name: ${{ matrix.project.name }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        project:
          - name: nexus-rs
            manifest: nexus-rs/Cargo.toml
          - name: nexus-desktop
            manifest: nexus-desktop/Cargo.toml

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --manifest-path ${{ matrix.project.manifest }} -- --check

      - name: Check compilation
        run: cargo check --manifest-path ${{ matrix.project.manifest }}
