name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Compile package
        run: python -m compileall -q src
      - name: Run complete test suite
        shell: bash
        run: |
          set +e
          python -m pytest tests/ -q --tb=short -W error::ResourceWarning > pytest_output.txt 2>&1
          test_status=$?
          cat pytest_output.txt
          exit "$test_status"
      - name: Upload canonical test evidence
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: canonical-pytest-output
          path: pytest_output.txt
          if-no-files-found: error
          retention-days: 14

  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Ruff
        run: |
          python -m ruff check src/
          python -m ruff format --check src/
      - name: Strict MyPy for typed runtime and evidence boundaries
        run: |
          python -m mypy --follow-imports=silent \
            src/nexus_agent/team/runtime.py \
            src/nexus_agent/team/models.py \
            src/nexus_agent/team/quality.py \
            src/nexus_agent/team/providers.py \
            src/nexus_agent/research/store.py \
            src/nexus_agent/storage/layout.py \
            src/nexus_agent/agents/models.py

  native:
    name: Native (${{ matrix.project.name }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        project:
          - name: nexus-rs
            manifest: nexus-rs/Cargo.toml
          - name: nexus-desktop
            manifest: nexus-desktop/Cargo.toml
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust formatting
        run: cargo fmt --manifest-path ${{ matrix.project.manifest }} -- --check
      - name: Rust compilation
        run: cargo check --manifest-path ${{ matrix.project.manifest }}

  governance:
    name: Repository default-branch advisory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report repository default branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')
          if [ "$default_branch" != "main" ]; then
            echo "::warning::Repository default branch is '$default_branch', not 'main'. Issue #326 tracks the administrator-only setting change; this workflow cannot change repository settings."
            exit 0
          fi
          echo "Repository default branch is correctly set to main."
  version:
    name: Version contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check synchronized versions
        run: python scripts/check_version.py

  audit:
    name: Audit evidence
    needs: tests
    if: ${{ needs.tests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: canonical-pytest-output
          path: evidence
      - name: Generate audit reports
        run: python .githooks/pre-commit --from-file evidence/pytest_output.txt --ci
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: audit-evidence
          path: |
            docs/exhaustive_audit.md
            docs/FRESH_AUDIT.md
          if-no-files-found: error
          retention-days: 14

  full-tree-mypy-baseline:
    name: Full-tree MyPy inventory (advisory)
    if: github.event_name == 'pull_request' && github.head_ref == 'hardening/full-tree-mypy-qualification'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Capture full-tree strict MyPy diagnostics
        shell: bash
        run: |
          set +e
          python -m mypy --no-incremental src/nexus_agent/ > full_tree_mypy.txt 2>&1
          mypy_status=$?
          cat full_tree_mypy.txt
          echo "Full-tree MyPy exit status: $mypy_status" >> full_tree_mypy.txt
          echo "Full-tree MyPy exit status: $mypy_status" >> "$GITHUB_STEP_SUMMARY"
          exit "$mypy_status"
      - name: Upload full-tree MyPy baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-tree-mypy-baseline
          path: full_tree_mypy.txt
          if-no-files-found: warn
          retention-days: 14
  required:
    name: Required
    if: always()
    needs: [tests, lint, native, version, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce CI quality gate
        env:
          TESTS: ${{ needs.tests.result }}
          LINT: ${{ needs.lint.result }}
          NATIVE: ${{ needs.native.result }}
          VERSION: ${{ needs.version.result }}
          AUDIT: ${{ needs.audit.result }}
        shell: bash
        run: |
          set -eu
          for result in "tests=$TESTS" "lint=$LINT" "native=$NATIVE" "version=$VERSION" "audit=$AUDIT"; do
            case "$result" in
              *success) ;;
              *) echo "CI gate failed: $result"; exit 1 ;;
            esac
          done
          echo "All required CI gates passed."
