name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-agent-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Compile package
        run: python -m compileall -q src
      - name: Run complete test suite
        shell: bash
        run: |
          set +e
          python -m pytest tests/ -q --tb=short -W error::ResourceWarning > pytest_output.txt 2>&1
          test_status=$?
          cat pytest_output.txt
          exit "$test_status"
      - name: Upload canonical test evidence
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        uses: actions/upload-artifact@v4
        with:
          name: canonical-pytest-output
          path: pytest_output.txt
          if-no-files-found: error
          retention-days: 14

  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Ruff
        run: |
          python -m ruff check src/
          python -m ruff format --check src/
      - name: MyPy
        run: python -m mypy src/nexus_agent/

  ruff-autofix:
    name: One-time format normalization (PR #357)
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'automation/formatting-ba4eabe9203f' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Ruff
        run: python -m pip install --upgrade ruff
      - name: Apply Python and Rust formatters
        run: |
          python -m ruff check --fix src/ || true
          python -m ruff format src/
          cargo fmt --manifest-path nexus-rs/Cargo.toml
          cargo fmt --manifest-path nexus-desktop/Cargo.toml
      - name: Commit formatter changes to the PR branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src nexus-rs nexus-desktop; then
            echo "All source files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src nexus-rs nexus-desktop
          git commit -m "chore: apply CI formatter fixes"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
  native:
    name: Native (${{ matrix.project.name }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        project:
          - name: nexus-rs
            manifest: nexus-rs/Cargo.toml
          - name: nexus-desktop
            manifest: nexus-desktop/Cargo.toml
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust formatting
        run: cargo fmt --manifest-path ${{ matrix.project.manifest }} -- --check
      - name: Rust compilation
        run: cargo check --manifest-path ${{ matrix.project.manifest }}

  governance:
    name: Repository governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require main as repository default branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')
          if [ "$default_branch" != "main" ]; then
            echo "Repository default branch is '$default_branch'; expected 'main'."
            exit 1
          fi
          echo "Repository default branch is correctly set to main."
  version:
    name: Version contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check synchronized versions
        run: python scripts/check_version.py

  audit:
    name: Audit evidence
    needs: tests
    if: ${{ needs.tests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: canonical-pytest-output
          path: evidence
      - name: Generate audit reports
        run: python .githooks/pre-commit --from-file evidence/pytest_output.txt --ci
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: audit-evidence
          path: |
            docs/exhaustive_audit.md
            docs/FRESH_AUDIT.md
          if-no-files-found: error
          retention-days: 14

  required:
    name: Required
    if: always()
    needs: [tests, lint, native, version, governance, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce CI quality gate
        env:
          TESTS: ${{ needs.tests.result }}
          LINT: ${{ needs.lint.result }}
          NATIVE: ${{ needs.native.result }}
          VERSION: ${{ needs.version.result }}
          GOVERNANCE: ${{ needs.governance.result }}
          AUDIT: ${{ needs.audit.result }}
        shell: bash
        run: |
          set -eu
          for result in "tests=$TESTS" "lint=$LINT" "native=$NATIVE" "version=$VERSION" "governance=$GOVERNANCE" "audit=$AUDIT"; do
            case "$result" in
              *success) ;;
              *) echo "CI gate failed: $result"; exit 1 ;;
            esac
          done
          echo "All required CI gates passed."
